[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["chroma_db", "backups"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E111", "E114", "E117", "E402", "E501", "E741"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
exclude = ["tests", "chroma_db"]
