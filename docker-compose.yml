version: '3.8'

services:
  api:
    build: .
    container_name: goalos-api
    ports:
      - "8000:8000"
    volumes:
      - ./goalos.db:/app/goalos.db
      - ./chroma_db:/app/chroma_db
    env_file:
      - .env
    environment:
      - PORT=8000
    restart: unless-stopped

  # NOTE: this service builds from the same image as `api`, which bakes in a
  # HEALTHCHECK that curls /health -- a route this Streamlit app (port 8501)
  # doesn't serve. `docker ps` will likely show this container as
  # "unhealthy"; that's expected and harmless for local dev, not a real
  # problem, and doesn't affect the Cloud Run deployment (which doesn't use
  # docker-compose or this healthcheck).
  ui:
    build: .
    container_name: goalos-ui
    ports:
      - "8501:8501"
    volumes:
      - ./goalos.db:/app/goalos.db
      - ./chroma_db:/app/chroma_db
    env_file:
      - .env
    command: ["streamlit", "run", "app/app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    depends_on:
      - api
    restart: unless-stopped
